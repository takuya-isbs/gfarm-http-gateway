name: docker/dist real-Gfarm E2E

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version under test
        required: true
        type: string
      bake-target:
        description: http-gw Buildx Bake target
        required: true
        type: string
      http-gw-url:
        description: http-gw URL used by c1 and Playwright
        required: true
        type: string
      insecure-tls:
        description: Skip TLS verification for the HTTPS NGINX endpoint
        required: false
        default: false
        type: boolean

jobs:
  e2e:
    name: Python ${{ inputs.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: checkout Gfarm
        uses: actions/checkout@v7
        with:
          repository: takuya-isbs/gfarm
          ref: feature/docker-dist-gfarm-http-gateway
          path: gfarm

      - name: checkout gfarm-http-gateway
        uses: actions/checkout@v7
        with:
          path: gfarm/gfarm-http-gateway

      - name: Download frozen requirements
        uses: actions/download-artifact@v7
        with:
          name: frozen-requirements
          path: gfarm/gfarm-http-gateway/server

      - name: Get Docker build user
        id: user
        run: |
          echo "name=$(id -un)" >> "$GITHUB_OUTPUT"
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Pull registry images in parallel
        run: |
          pids=()
          docker compose -f gfarm/docker/dist/jwt-server/docker-compose.yaml \
            pull --ignore-buildable --ignore-pull-failures --quiet &
          pids+=("$!")
          make -C gfarm/docker/dist/http-gateway pull &
          pids+=("$!")
          playwright_image=$(<gfarm/gfarm-http-gateway/server/e2e-test/playwright-docker-image.txt)
          echo "[PREP] Docker host: pulling Playwright image ${playwright_image}..."
          docker pull "$playwright_image" &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Build docker/dist images
        uses: docker/bake-action@v7
        env:
          BUILD_USER: ${{ steps.user.outputs.name }}
          BUILD_UID: ${{ steps.user.outputs.uid }}
        with:
          source: gfarm
          files: |
            docker/dist/docker-bake.hcl
            gfarm-http-gateway/server/e2e-test/docker-dist/docker-bake.hcl
          targets: gfarm,${{ inputs.bake-target }}
          load: true
          set: |
            minica.cache-from=type=gha,scope=gfarm-http-gateway-minica
            minica.cache-to=type=gha,mode=max,scope=gfarm-http-gateway-minica
            gfarm-ubuntu.cache-from=type=gha,scope=gfarm-http-gateway-gfarm-ubuntu
            gfarm-ubuntu.cache-to=type=gha,mode=max,scope=gfarm-http-gateway-gfarm-ubuntu
            jwt-server-back.cache-from=type=gha,scope=gfarm-http-gateway-jwt-server-back
            jwt-server-back.cache-to=type=gha,mode=max,scope=gfarm-http-gateway-jwt-server-back
            setup-keycloak.cache-from=type=gha,scope=gfarm-http-gateway-setup-keycloak
            setup-keycloak.cache-to=type=gha,mode=max,scope=gfarm-http-gateway-setup-keycloak
            ${{ inputs.bake-target }}.cache-from=type=gha,scope=gfarm-http-gateway-python${{ inputs.python-version }}
            ${{ inputs.bake-target }}.cache-to=type=gha,mode=max,scope=gfarm-http-gateway-python${{ inputs.python-version }}

      - name: Create docker/dist certificates and start Gfarm containers
        run: |
          cd gfarm/docker/dist
          MINICA_SKIP_BUILD=1 sh ./minica.sh
          docker compose up -d --no-build

      - name: Build and initialize Gfarm
        run: |
          docker exec -u "$USER" -w "/home/$USER/gfarm/docker/dist" gfarm-c1 \
            sh ./all.sh

      - name: Initialize Keycloak and JWT Server 1
        run: timeout 10m make -C gfarm/docker/dist/jwt-server init-jwt-server1

      - name: Start JWT Server
        run: |
          docker compose -f gfarm/docker/dist/jwt-server/docker-compose.yaml \
            up -d jwt-server-front

      - name: Copy Gfarm CA certificates to http-gw
        run: make -C gfarm/docker/dist/http-gateway setup

      - name: Start http-gw under test
        run: |
          make -C gfarm/docker/dist/http-gateway \
            "compose-up-python${{ inputs.python-version }}-nobuild"

      - name: Wait for http-gw
        env:
          GFARM_HTTP_GATEWAY_URL: ${{ inputs.http-gw-url }}
          INSECURE_TLS: ${{ inputs.insecure-tls }}
        run: |
          curl_options=()
          if [[ "$INSECURE_TLS" == true ]]; then
            curl_options+=(--insecure)
          fi
          for attempt in $(seq 1 60); do
            if docker exec gfarm-c1 curl "${curl_options[@]}" --fail --silent \
              "${GFARM_HTTP_GATEWAY_URL}/openapi.json" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "${GFARM_HTTP_GATEWAY_URL} did not become ready within 120 seconds." >&2
          exit 1

      - name: Run real-Gfarm E2E tests
        env:
          GFARM_HTTP_TEST_PASSWORD: PASSWORD
          GFARM_HTTP_GATEWAY_URL: ${{ inputs.http-gw-url }}
          GFARM_HTTP_TEST_INSECURE: ${{ inputs.insecure-tls }}
        run: make -C gfarm/docker/dist/http-gateway test-e2e

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/docker-dist-logs"
          docker compose -f gfarm/docker/dist/docker-compose.yaml logs --no-color \
            > "$RUNNER_TEMP/docker-dist-logs/gfarm-compose.log" 2>&1 || true
          docker compose -f gfarm/docker/dist/jwt-server/docker-compose.yaml logs --no-color \
            > "$RUNNER_TEMP/docker-dist-logs/jwt-server-compose.log" 2>&1 || true
          make -C gfarm/docker/dist/http-gateway logs \
            > "$RUNNER_TEMP/docker-dist-logs/http-gw-compose.log" 2>&1 || true
          docker exec gfarm-c1 journalctl -b -n 1000 --no-pager \
            > "$RUNNER_TEMP/docker-dist-logs/gfarm-c1-journal.log" 2>&1 || true

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-dist-e2e-logs-python-${{ inputs.python-version }}
          path: ${{ runner.temp }}/docker-dist-logs/
