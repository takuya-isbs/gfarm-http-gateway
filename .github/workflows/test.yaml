name: Test gfarm-http-gateway

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  push:
  pull_request:

env:
  PYTHON_REQUIREMENTS_BASELINE: "3.11"

jobs:
  # Resolve the latest Python dependencies once; every later job installs this exact set.
  prepare-requirements:
    name: Freeze Python requirements
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_REQUIREMENTS_BASELINE }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install latest Python dependencies and freeze requirements
        working-directory: server
        run: make setup-latest-freeze

      - name: Upload frozen requirements
        uses: actions/upload-artifact@v7
        with:
          name: frozen-requirements
          path: server/requirements.txt
          if-no-files-found: error

  unit-test:
    name: unit test
    needs:
      - prepare-requirements
    # Keep ubuntu-latest so future Ubuntu updates expose compatibility problems across the CI checks.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Download frozen requirements
        uses: actions/download-artifact@v7
        with:
          name: frozen-requirements
          path: server

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_REQUIREMENTS_BASELINE }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./client/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: ./server/venv
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install tested Python dependencies
        working-directory: server
        run: make setup

      - name: Install Python dev dependencies
        working-directory: server
        run: make setup-dev

      - name: Install Playwright browsers
        working-directory: server
        run: make setup-playwright

      # GitHub sets CI=true; make ci passes the same flag to local test runs.
      - name: Run CI checks
        run: make ci

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ./server/frontend/app/react-app/playwright-report/

  e2e-test-python3_11:
    name: docker/dist real-Gfarm E2E (Python 3.11)
    needs:
      - prepare-requirements
    uses: ./.github/workflows/docker-dist-e2e.yml
    with:
      python-version: "3.11"
      bake-target: http-gw-python3_11
      http-gw-url: http://http-gw-python3-11:8000

  e2e-test-python3_15:
    name: docker/dist real-Gfarm E2E (Python 3.15 via NGINX HTTPS)
    needs:
      - prepare-requirements
    uses: ./.github/workflows/docker-dist-e2e.yml
    with:
      python-version: "3.15"
      bake-target: http-gw-python3_15
      http-gw-url: https://http-gw-https
      insecure-tls: true

  update-requirements:
    name: Update Python requirements
    needs:
      - prepare-requirements
      - unit-test
      - e2e-test-python3_11
      - e2e-test-python3_15
    if: github.event_name == 'push' && github.ref_type == 'branch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download tested requirements
        uses: actions/download-artifact@v7
        with:
          name: frozen-requirements
          path: ${{ runner.temp }}/frozen-requirements

      - name: Apply tested requirements
        run: cp "${RUNNER_TEMP}/frozen-requirements/requirements.txt" server/requirements.txt

      - name: Commit requirements.txt
        id: commit
        run: |
          git add server/requirements.txt
          if git diff --cached --quiet -- server/requirements.txt; then
            echo "requirements.txt is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # [skip ci] prevents the bot commit from triggering this workflow again.
          # https://docs.github.com/ja/actions/how-tos/manage-workflow-runs/skip-workflow-runs
          git commit -m "(GitHub Actions) update requirements.txt [skip ci]"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push requirements.txt
        if: steps.commit.outputs.changed == 'true'
        run: |
          # Push is rejected (non-fast-forward) when the branch moved after the tests started.
          # Fail with a clear message; the next push re-runs the tests and this job.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::error::Failed to push requirements.txt. The branch may have advanced after the tests started; re-run after the new push's tests complete." >&2
            exit 1
          fi
