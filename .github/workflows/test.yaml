name: Test gfarm-http-gateway

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  push:
  pull_request:

jobs:
  # Resolve the latest Python dependencies once; every later job installs this exact set.
  prepare-requirements:
    name: Freeze Python requirements
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install latest Python dependencies
        working-directory: server
        run: make setup-latest

      - name: Freeze Python dependencies
        working-directory: server
        run: make freeze

      - name: Upload frozen requirements
        uses: actions/upload-artifact@v7
        with:
          name: frozen-requirements
          path: server/requirements.txt
          if-no-files-found: error

  unit-test:
    name: unit test
    needs:
      - prepare-requirements
    # Keep ubuntu-latest so future Ubuntu updates expose compatibility problems across the CI checks.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Download frozen requirements
        uses: actions/download-artifact@v4
        with:
          name: frozen-requirements
          path: server

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./client/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ./server/venv
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install tested Python dependencies
        working-directory: server
        run: make setup

      - name: Install Playwright browsers
        working-directory: server
        run: make setup-playwright

      # GitHub sets CI=true; make ci passes the same flag to local test runs.
      - name: Run CI checks
        run: make ci

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./server/frontend/app/react-app/playwright-report/

  docker-dist-integration:
    name: docker/dist integration
    needs:
      - prepare-requirements
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: checkout Gfarm
        uses: actions/checkout@v7
        with:
          repository: takuya-isbs/gfarm
          ref: feature/docker-dist-gfarm-http-gateway
          path: gfarm

      - name: checkout gfarm-http-gateway
        uses: actions/checkout@v7
        with:
          path: gfarm/gfarm-http-gateway

      # The Gateway image installs the frozen requirements.txt from this build context.
      - name: Download frozen requirements
        uses: actions/download-artifact@v4
        with:
          name: frozen-requirements
          path: gfarm/gfarm-http-gateway/server

      - name: Get Docker build user
        id: user
        run: |
          echo "name=$(id -un)" >> "$GITHUB_OUTPUT"
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull Compose images and the Playwright image concurrently.
      # --ignore-pull-failures skips locally built images (for example gfarm-jwt-server:local).
      - name: Pull registry images in parallel
        run: |
          pids=()
          for compose_file in \
            gfarm/docker/dist/jwt-server/docker-compose.yaml \
            gfarm/docker/dist/http-gateway/docker-compose.yaml; do
            docker compose -f "$compose_file" pull --ignore-buildable --ignore-pull-failures --quiet &
            pids+=("$!")
          done
          playwright_image=$(<gfarm/gfarm-http-gateway/server/bin/playwright-docker-image.txt)
          echo "[PREP] Docker host: pulling Playwright image ${playwright_image}..."
          docker pull "$playwright_image" &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      # Build the docker/dist images concurrently, run from the gfarm root (source: gfarm).
      # Bake files are used instead of compose files: see docker/dist/docker-bake.hcl.
      # Cache is per target (GitHub Actions cache).
      - name: Build docker/dist images in parallel
        uses: docker/bake-action@v7
        env:
          BUILD_USER: ${{ steps.user.outputs.name }}
          BUILD_UID: ${{ steps.user.outputs.uid }}
        with:
          source: gfarm
          files: |
            docker/dist/docker-bake.hcl
            docker/dist/http-gateway/docker-bake.hcl
          targets: gfarm,gateway
          load: true
          set: |
            minica.cache-from=type=gha,scope=gfarm-http-gateway-minica
            minica.cache-to=type=gha,mode=max,scope=gfarm-http-gateway-minica
            gfarm-ubuntu.cache-from=type=gha,scope=gfarm-http-gateway-gfarm-ubuntu
            gfarm-ubuntu.cache-to=type=gha,mode=max,scope=gfarm-http-gateway-gfarm-ubuntu
            jwt-server-back.cache-from=type=gha,scope=gfarm-http-gateway-jwt-server-back
            jwt-server-back.cache-to=type=gha,mode=max,scope=gfarm-http-gateway-jwt-server-back
            setup-keycloak.cache-from=type=gha,scope=gfarm-http-gateway-setup-keycloak
            setup-keycloak.cache-to=type=gha,mode=max,scope=gfarm-http-gateway-setup-keycloak
            gateway.cache-from=type=gha,scope=gfarm-http-gateway-gateway
            gateway.cache-to=type=gha,mode=max,scope=gfarm-http-gateway-gateway

      - name: Create docker/dist certificates and start Gfarm containers
        run: |
          cd gfarm/docker/dist
          MINICA_SKIP_BUILD=1 sh ./minica.sh
          docker compose up -d --no-build

      - name: Build and initialize Gfarm
        run: |
          docker exec -u "$USER" -w "/home/$USER/gfarm/docker/dist" gfarm-c1 \
            sh ./all.sh

      - name: Initialize Keycloak and JWT Server 1
        run: timeout 10m make -C gfarm/docker/dist/jwt-server init-jwt-server1

      - name: Start JWT Server
        run: |
          docker compose -f gfarm/docker/dist/jwt-server/docker-compose.yaml \
            up -d jwt-server-front

      - name: Copy Gfarm CA certificates to Gateway
        run: make -C gfarm/docker/dist/http-gateway setup

      # The gateway image is built by the bake step above, so start without building.
      - name: Start Gateway
        run: make -C gfarm/docker/dist/http-gateway up-nobuild

      - name: Wait for Gateway
        run: |
          for attempt in $(seq 1 60); do
            if docker exec gfarm-c1 curl --fail --silent \
              http://gfarm-http-gateway-http:8000/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Gateway did not become ready within 120 seconds." >&2
          exit 1

      - name: Run real-Gfarm integration test
        env:
          GFARM_HTTP_TEST_PASSWORD: PASSWORD
        run: make -C gfarm/docker/dist/http-gateway test

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/docker-dist-logs"
          docker compose -f gfarm/docker/dist/docker-compose.yaml logs --no-color \
            > "$RUNNER_TEMP/docker-dist-logs/gfarm-compose.log" 2>&1 || true
          docker compose -f gfarm/docker/dist/jwt-server/docker-compose.yaml logs --no-color \
            > "$RUNNER_TEMP/docker-dist-logs/jwt-server-compose.log" 2>&1 || true
          docker compose --env-file gfarm/docker/dist/http-gateway/.env \
            -f gfarm/docker/dist/http-gateway/docker-compose.yaml logs --no-color \
            > "$RUNNER_TEMP/docker-dist-logs/gateway-compose.log" 2>&1 || true
          docker exec gfarm-c1 journalctl -b -n 1000 --no-pager \
            > "$RUNNER_TEMP/docker-dist-logs/gfarm-c1-journal.log" 2>&1 || true

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-dist-integration-logs
          path: ${{ runner.temp }}/docker-dist-logs/

  update-requirements:
    name: Update Python requirements
    needs:
      - prepare-requirements
      - unit-test
      - docker-dist-integration
    if: github.event_name == 'push' && github.ref_type == 'branch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download tested requirements
        uses: actions/download-artifact@v4
        with:
          name: frozen-requirements
          path: ${{ runner.temp }}/frozen-requirements

      - name: Apply tested requirements
        run: cp "${RUNNER_TEMP}/frozen-requirements/requirements.txt" server/requirements.txt

      - name: Commit requirements.txt
        id: commit
        run: |
          git add server/requirements.txt
          if git diff --cached --quiet -- server/requirements.txt; then
            echo "requirements.txt is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # [skip ci] prevents the bot commit from triggering this workflow again.
          # https://docs.github.com/ja/actions/how-tos/manage-workflow-runs/skip-workflow-runs
          git commit -m "(GitHub Actions) update requirements.txt [skip ci]"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push requirements.txt
        if: steps.commit.outputs.changed == 'true'
        run: |
          # Push is rejected (non-fast-forward) when the branch moved after the tests started.
          # Fail with a clear message; the next push re-runs the tests and this job.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::error::Failed to push requirements.txt. The branch may have advanced after the tests started; re-run after the new push's tests complete." >&2
            exit 1
          fi
