[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["api", "api/test"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["authlib.*", "jose.*"]
ignore_missing_imports = true
